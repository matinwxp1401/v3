<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- گرادیانت اختصاصی نشان رسمی پویش مشارکتهای مردمی و نذورات -->
    <linearGradient id="protectiveEmblemGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="25%" stop-color="#0d9488" />
      <stop offset="60%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.18" />
    </filter>
  </defs>

